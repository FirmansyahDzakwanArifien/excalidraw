name: Build and Deploy Excalidraw

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"  # tiap Minggu 10:00 WIB

permissions: {}

concurrency:
  group: excalidraw-deploy
  cancel-in-progress: false

env:
  EXCALIDRAW_REPO: https://github.com/excalidraw/excalidraw.git
  SITE_DOMAIN: excalidraw.cyphera.my.id
  UPSTREAM_DIR: build/excalidraw

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Clone upstream Excalidraw
        run: |
          git clone --depth=1 "$EXCALIDRAW_REPO" "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" rev-parse HEAD > build/upstream-sha.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.UPSTREAM_DIR }}/package.json

      - name: Install dependencies
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive

      - name: Build static app
        working-directory: ${{ env.UPSTREAM_DIR }}
        env:
          VITE_APP_DISABLE_SENTRY: "true"
        run: yarn build:app:docker

      - name: Prepare Pages output
        run: |
          SITE_DIR="$UPSTREAM_DIR/excalidraw-app/build"
          printf "%s\n" "$SITE_DOMAIN" > "$SITE_DIR/CNAME"
          touch "$SITE_DIR/.nojekyll"

      - name: Deploy to gh-pages
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          SITE_DIR="$UPSTREAM_DIR/excalidraw-app/build"
          cd "$SITE_DIR"
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy Excalidraw $(cat ../../../build/upstream-sha.txt | head -c 7)"
          git remote add origin "git@github.com:${{ github.repository }}.git"
          git push --force origin HEAD:gh-pages